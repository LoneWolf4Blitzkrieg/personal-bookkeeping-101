<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print a ledger sheet · Personal Bookkeeping 101</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/ledger.css">
  <link rel="stylesheet" href="css/print.css">
  <script>try { if (localStorage.getItem('pb101-large-text') === '1') document.documentElement.classList.add('large-text'); } catch (e) { /* storage blocked */ }</script>
  <script>
    // Opened straight from a file: the course runs inside index.html there (see offline/course.js).
    if (location.protocol === 'file:') location.replace('index.html#/' + location.pathname.split('/').pop() + location.search);
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the sheet</a>

  <header class="topbar">
    <a class="brand" href="index.html">Personal Bookkeeping <span>101</span></a>
  </header>

  <main class="home print-page" id="main">
    <h1 class="no-print" id="sheet-title">Print a ledger sheet</h1>
    <p class="no-print" id="sheet-note">Use your browser's print command, or the button below. The sheet prints on one landscape page.</p>
    <p class="no-print"><button class="button print-button" type="button" id="print-button">Print this sheet</button></p>
    <div id="sheet"></div>
  </main>

  <footer class="site-footer">
    <p><i>Personal Bookkeeping 101</i> by Raul Bautista is licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license">CC BY-NC-SA 4.0</a> (free for non-commercial use).</p>
  </footer>

  <script type="module">
    import { renderPrintPage, lessonSheet, sheetFor } from './js/app/print.js';
    const params = new URLSearchParams(location.search);
    let title;
    const fromLesson = params.has('lesson') ? lessonSheet(params.get('lesson'), params.get('step')) : null;
    if (fromLesson) {
      document.getElementById('sheet').innerHTML = fromLesson.html;
      title = fromLesson.title;
    } else {
      title = renderPrintPage(document.getElementById('sheet'), params.get('sheet') || 'blank');
      const note = sheetFor(params.get('sheet') || 'blank')?.note;
      if (note) document.getElementById('sheet-note').textContent = note;
    }
    if (title) {
      document.getElementById('sheet-title').textContent = title;
      document.title = `${title} · Personal Bookkeeping 101`;
    }
    document.getElementById('print-button').addEventListener('click', () => window.print());
  </script>
</body>
</html>
